
name: Android Build and Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android Unit Tests and APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Download speech model dependencies
        run: bash scripts/fetch_models.sh

      - name: Run Android unit tests
        working-directory: G2glasses
        run: sh ./gradlew --no-daemon testDebugUnitTest

      - name: Build Android APK
        working-directory: G2glasses
        run: sh ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: G2glasses/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
